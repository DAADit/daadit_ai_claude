<?xml version="1.0" encoding="UTF-8"?>
<!--
    Claude (Anthropic) brand icon for the DAADit AI Claude module.

    Design:
      * Cream background (#F0EEE6 — Anthropic's "Bone" cream)
      * Coral asterisk mark (#CC785C — Anthropic's accent orange)
      * 12-point sunburst — Claude's signature mark.

    Each ray is a tapered diamond pointing radially outward. The shape
    is constructed in object-space at angle 0 (pointing up) and rotated
    in 30° steps via the <g transform> on each <polygon>.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 256 256"
     width="256" height="256">
  <rect width="256" height="256" rx="48" ry="48" fill="#F0EEE6"/>
  <g transform="translate(128,128)" fill="#CC785C">
    <g transform="rotate(0)"><polygon points="0,-16 14,-72 0,-108 -14,-72"/></g>
    <g transform="rotate(30)"><polygon points="0,-16 14,-72 0,-108 -14,-72"/></g>
    <g transform="rotate(60)"><polygon points="0,-16 14,-72 0,-108 -14,-72"/></g>
    <g transform="rotate(90)"><polygon points="0,-16 14,-72 0,-108 -14,-72"/></g>
    <g transform="rotate(120)"><polygon points="0,-16 14,-72 0,-108 -14,-72"/></g>
    <g transform="rotate(150)"><polygon points="0,-16 14,-72 0,-108 -14,-72"/></g>
    <g transform="rotate(180)"><polygon points="0,-16 14,-72 0,-108 -14,-72"/></g>
    <g transform="rotate(210)"><polygon points="0,-16 14,-72 0,-108 -14,-72"/></g>
    <g transform="rotate(240)"><polygon points="0,-16 14,-72 0,-108 -14,-72"/></g>
    <g transform="rotate(270)"><polygon points="0,-16 14,-72 0,-108 -14,-72"/></g>
    <g transform="rotate(300)"><polygon points="0,-16 14,-72 0,-108 -14,-72"/></g>
    <g transform="rotate(330)"><polygon points="0,-16 14,-72 0,-108 -14,-72"/></g>
  </g>
</svg>
